# Meson cross file: GBA / ARM7TDMI / Thumb-1 / bare metal.
# CLANG and LLVM_BIN are substituted by scripts/build-picolibc.sh.
[binaries]
c = ['@CLANG@', '--target=arm-none-eabi', '-mcpu=arm7tdmi', '-march=armv4t', '-mthumb']
ar = '@LLVM_BIN@/llvm-ar'
nm = '@LLVM_BIN@/llvm-nm'
strip = '@LLVM_BIN@/llvm-strip'
objcopy = '@LLVM_BIN@/llvm-objcopy'

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'arm7tdmi'
endian = 'little'

[built-in options]
c_args = ['-O2', '-ffreestanding', '-fno-common', '-fno-stack-protector']
c_link_args = ['-nostdlib']

[properties]
skip_sanity_check = true
