# Meson cross file: GBA / ARM7TDMI / Thumb-1 / bare metal.
# CLANG and LLVM_BIN are substituted by scripts/build-picolibc.sh.
[binaries]
c = ['@CLANG@', '--target=armv4t-none-eabi', '-mcpu=arm7tdmi', '-march=armv4t', '-mthumb']
c_ld = '@LLVM_BIN@/ld.lld'
ar = '@LLVM_BIN@/llvm-ar'
nm = '@LLVM_BIN@/llvm-nm'
strip = '@LLVM_BIN@/llvm-strip'
objcopy = '@LLVM_BIN@/llvm-objcopy'

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'arm7tdmi'
endian = 'little'

[built-in options]
c_args = ['-O2', '-ffreestanding', '-fno-common', '-fno-stack-protector', '-mabi=apcs-gnu', '-mno-unaligned-access']
c_link_args = ['-nostdlib', '-mabi=apcs-gnu']

[properties]
skip_sanity_check = true
