name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q scripts omvll
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Patch headers
        run: |
          for patch in patches/*.patch; do
            grep -q '^--- ' "$patch"
            grep -q '^+++ ' "$patch"
          done
